[project]
name = "hackthon-yuno-nauta"
version = "0.1.0"
description = "TryTrust — a trust layer for purchases made by AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "cryptography>=44.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "mcp>=1.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]

[tool.uv]
package = false
