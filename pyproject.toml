[project]
name = "hackthon-yuno-nauta"
version = "0.1.0"
description = "Aval trust layer for agent-initiated purchases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.115,<1.0",
    "google-cloud-kms>=3.16.0",
    "google-cloud-storage>=3.13.1",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["src/api/tests", "src/mocks/yuno/tests"]
markers = [
    "db: tests requiring a PostgreSQL service",
    "gcp: tests requiring GCP credentials (KMS/GCS)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
