[project]
name = "aval"
version = "0.0.1a0"
description = "Aval — a trust layer for purchases made by AI agents (NextWave 2026, Yuno x Nauta)"
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
# Config Rappi OTP login capture (headful Chrome via channel="chrome");
# the token never leaves the machine, so this stays an opt-in extra.
rappi = ["playwright>=1.5"]
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30.0",
    "cryptography>=44.0",
    "fastapi>=0.115",
    "google-cloud-kms>=3.0.0",
    "google-cloud-secret-manager>=2.0.0",
    "google-cloud-storage>=3.0.0",
    "httpx>=0.28",
    "jwcrypto>=1.5.6",
    "mcp>=1.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-ulid>=4.0",
    "pyyaml>=6.0",
    "rfc8785>=0.1.4",
    "sd-jwt>=0.10.4",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
    "webauthn>=2.5",
]

[dependency-groups]
dev = [
    "cbor2>=6.0",
    "hypothesis>=6.115",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "src/api/tests"]
asyncio_mode = "auto"
markers = [
    "db: tests requiring a PostgreSQL service",
    "gcp: tests requiring GCP credentials (KMS/GCS)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
