name: infra-apply

# Manual infra apply per environment. prod maps to the GitHub "prod"
# environment (required reviewers). Always plan-reviewed in the PR first.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: iac

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: Tofu init (${{ inputs.environment }})
        run: tofu init -backend-config=environments/${{ inputs.environment }}.backend.hcl -input=false

      - name: Tofu apply (${{ inputs.environment }})
        run: tofu apply -var-file=environments/${{ inputs.environment }}.tfvars -input=false -auto-approve
