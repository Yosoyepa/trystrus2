name: infra-apply

# Manual infra apply per environment. prod maps to the GitHub "prod"
# environment (required reviewers). Always plan-reviewed in the PR first.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options:
          - dev
          - prod
      operation:
        description: "Apply infrastructure or recover one exact stale lock"
        required: true
        type: choice
        options:
          - apply
          - force-unlock
        default: apply
      lock_id:
        description: "Exact infra-plan lock ID (force-unlock only)"
        required: false
        type: string
      confirmation:
        description: "Type FORCE_UNLOCK for force-unlock"
        required: false
        type: string

concurrency:
  group: tofu-state-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected-production kill switch
        if: inputs.environment == 'prod' && inputs.operation == 'apply'
        env:
          PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
        run: |
          if [ "$PROD_DEPLOY_ENABLED" != "true" ]; then
            echo "PROD_DEPLOY_ENABLED must be true only after the prod environment has required reviewers."
            exit 1
          fi

  apply:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: iac

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/834218710552/locations/global/workloadIdentityPools/aval-github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'aval-dev-deploy@trytrust.iam.gserviceaccount.com' }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: Tofu init (${{ inputs.environment }})
        run: tofu init -backend-config=environments/${{ inputs.environment }}.backend.hcl -input=false

      - name: Tofu apply (${{ inputs.environment }})
        if: inputs.operation == 'apply'
        run: |
          set -euo pipefail
          if ! tofu apply \
              -var-file=environments/${{ inputs.environment }}.tfvars \
              -var="project_id=${{ vars.GCP_PROJECT }}" \
              -var="rappi_bridge_url=${{ vars.RAPPI_BRIDGE_URL }}" \
              -input=false \
              -auto-approve \
              >/tmp/tofu-apply.log 2>&1; then
            echo "OpenTofu apply failed. Detailed values are withheld from public logs."
            exit 1
          fi
          echo "OpenTofu apply completed; state values were not printed."

      - name: Force-unlock exact stale lock
        if: inputs.operation == 'force-unlock'
        env:
          LOCK_ID: ${{ inputs.lock_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "FORCE_UNLOCK" ]]; then
            echo "Force-unlock requires the literal FORCE_UNLOCK confirmation."
            exit 1
          fi
          if [[ ! "$LOCK_ID" =~ ^[0-9A-Za-z-]+$ ]]; then
            echo "Invalid lock ID format."
            exit 1
          fi
          tofu force-unlock -force "$LOCK_ID"
