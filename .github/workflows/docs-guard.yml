name: docs-guard

# Documentation obligations (decision 0017):
#   - code change  -> devlog entry in the same PR
#   - contract change -> decision record in the same PR
# The gate is presence, not truth — review still reads.

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Documentation obligations
        run: bash scripts/docs-guard.sh origin/${{ github.base_ref }}
