name: deploy-prod

# Manual, approval-gated production deploy (GitHub environment "prod" with
# required reviewers). Runs the same pipeline as dev against prod tfvars
# values: min-instances=1, LB ingress, real domain secrets set.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to deploy (empty = selected commit SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected-production kill switch
        env:
          PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
        run: |
          if [ "$PROD_DEPLOY_ENABLED" != "true" ]; then
            echo "PROD_DEPLOY_ENABLED must be true only after the prod environment has required reviewers."
            exit 1
          fi

  deploy:
    needs: release-gate
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: prod

    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/aval
      TAG: ${{ inputs.image_tag || github.sha }}
      RAPPI_BRIDGE_URL: ${{ vars.RAPPI_BRIDGE_URL }}

    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Verify immutable images exist
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be the full 40-character commit SHA; got: $TAG"
            exit 1
          fi
          gcloud artifacts docker images describe "$REPO/backend:${TAG}" --project="$PROJECT"
          gcloud artifacts docker images describe "$REPO/web:${TAG}" --project="$PROJECT"

      - name: Point Cloud Run Jobs at this revision
        run: |
          set -euo pipefail
          for job in aval-prod-migrations aval-prod-outbox-relay aval-prod-sweeper; do
            gcloud run jobs update "$job" \
              --project="$PROJECT" \
              --region="$REGION" \
              --image="$REPO/backend:${TAG}" \
              --quiet
          done

      - name: Run migrations
        run: |
          set -euo pipefail
          if ! gcloud run jobs execute aval-prod-migrations \
              --project="$PROJECT" \
              --region="$REGION" \
              --wait; then
            gcloud run jobs executions list \
              --job=aval-prod-migrations \
              --project="$PROJECT" \
              --region="$REGION" \
              --limit=1 || true
            exit 1
          fi

      - name: Deploy all Cloud Run Services
        run: |
          set -euo pipefail
          gcloud run services update aval-prod-kernel \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$REPO/backend:${TAG}" \
            --update-env-vars="AVAL_YUNO_SIM_URL=https://trytrust.lat/yuno,TT_RAPPI_BRIDGE_URL=${RAPPI_BRIDGE_URL}" \
            --quiet

          gcloud run services update aval-prod-merchant \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$REPO/backend:${TAG}" \
            --quiet

          gcloud run services update aval-prod-yuno-sim \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$REPO/backend:${TAG}" \
            --quiet

          gcloud run services update aval-prod-web \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$REPO/web:${TAG}" \
            --quiet

      - name: Smoke test (through the LB, not run.app)
        run: |
          set -euo pipefail
          for path in /api/health /yuno/health /merchant/health /; do
            echo "checking https://trytrust.lat${path}"
            curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "https://trytrust.lat${path}" >/dev/null
          done

      - name: Prove real Rappi search when the tunnel is armed
        if: env.RAPPI_BRIDGE_URL != ''
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -d '{"text":"Busca una botella de agua en Rappi y muéstrame opciones"}' \
            https://trytrust.lat/api/agent/dispatch)
          echo "$RESPONSE" | jq -e \
            '.run.status == "done" and (.run.offers | length > 0) and (.run.offers[0].offer_id | startswith("rappi_"))' \
            >/dev/null

      - name: Tick relay and sweeper once
        run: |
          gcloud run jobs execute aval-prod-outbox-relay \
            --project="$PROJECT" --region="$REGION" --wait
          gcloud run jobs execute aval-prod-sweeper \
            --project="$PROJECT" --region="$REGION" --wait
