name: infra-plan

# PRs touching iac/**: tofu fmt + validate + plan (dev) with the plan
# commented on the PR. Requires WIF vars; skips otherwise.

on:
  pull_request:
    paths:
      - "iac/**"
  push:
    branches:
      - "iac/cloudrun"
    paths:
      - "iac/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

concurrency:
  # Plans, applies and recovery share this group across their workflows.
  # Never cancel a state operation: an interrupted GCS lock needs recovery.
  group: tofu-state-${{ github.repository }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: iac

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/834218710552/locations/global/workloadIdentityPools/aval-github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'aval-dev-deploy@trytrust.iam.gserviceaccount.com' }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: Tofu fmt
        run: tofu fmt -check -recursive

      - name: Tofu init
        run: tofu init -backend-config="environments/${TARGET_ENV}.backend.hcl" -input=false

      - name: Tofu validate
        run: tofu validate

      - name: Tofu plan
        id: plan
        run: |
          set -euo pipefail
          if ! tofu plan -json \
              -var-file="environments/${TARGET_ENV}.tfvars" \
              -var="project_id=${{ vars.GCP_PROJECT }}" \
              -input=false \
              -out=plan.out \
              >/tmp/tofu-plan.jsonl 2>&1; then
            echo "OpenTofu plan failed. Detailed values are withheld from public logs."
            jq -Rr '
              fromjson?
              | select(.type == "diagnostic")
              | .diagnostic.summary
              | select(type == "string")
              | "OpenTofu diagnostic: \(.)"
            ' /tmp/tofu-plan.jsonl | sort -u
            jq -Rr '
              fromjson?
              | select(.type == "diagnostic")
              | select(.diagnostic.summary == "Error acquiring the state lock")
              | .diagnostic.detail
              | capture("ID:[[:space:]]*(?<id>[0-9A-Za-z-]+)")?
              | "OpenTofu lock ID: \(.id)"
            ' /tmp/tofu-plan.jsonl | sort -u
            exit 1
          fi
          tofu show -json plan.out | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.address): \(.change.actions | join(","))"
          '

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const target = process.env.TARGET_ENV || 'dev';
            let body = `### \`tofu plan\` (${target}) — sanitized summary\n\`\`\`\n`;
            try {
              const plan = JSON.parse(
                execSync('tofu show -json plan.out', { cwd: 'iac' }).toString()
              );
              const changes = (plan.resource_changes || [])
                .filter(r => JSON.stringify(r.change.actions) !== JSON.stringify(['no-op']))
                .map(r => `${r.address}: ${r.change.actions.join(',')}`);
              body += changes.length ? changes.join('\n') : 'No changes.';
            } catch (e) {
              body += 'Plan summary unavailable; values are never published.';
            }
            body += '\n```';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `### \`tofu plan\` (${target}) — sanitized summary`;
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
