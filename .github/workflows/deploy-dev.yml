name: deploy-dev

# Deploys dev on every push to main. Gated on WIF bootstrap: while the GitHub
# repo vars (WIF_PROVIDER/DEPLOY_SA/GCP_PROJECT/GCP_REGION) are not set, this
# job skips so merging this branch cannot fire a broken deploy.

on:
  push:
    branches: [main, iac/cloudrun]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: dev

    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/aval

    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push backend image
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REPO }}/backend:${{ github.sha }}
            ${{ env.REPO }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REPO }}/web:${{ github.sha }}
            ${{ env.REPO }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run migrations (Cloud Run Job)
        run: |
          gcloud run jobs execute aval-dev-migrations \
            --project="$PROJECT" \
            --region="$REGION" \
            --wait

      - name: Deploy Cloud Run Services
        run: |
          gcloud run services update aval-dev-kernel \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${{ env.REPO }}/backend:${{ github.sha }}" \
            --quiet

          gcloud run services update aval-dev-merchant \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${{ env.REPO }}/backend:${{ github.sha }}" \
            --quiet

          gcloud run services update aval-dev-yuno-sim \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${{ env.REPO }}/backend:${{ github.sha }}" \
            --quiet

          gcloud run services update aval-dev-web \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${{ env.REPO }}/web:${{ github.sha }}" \
            --quiet

      - name: Smoke test
        run: |
          KERNEL_URL=$(gcloud run services describe aval-dev-kernel --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          MERCHANT_URL=$(gcloud run services describe aval-dev-merchant --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          YUNO_URL=$(gcloud run services describe aval-dev-yuno-sim --project="$PROJECT" --region="$REGION" --format='value(status.url)')
          WEB_URL=$(gcloud run services describe aval-dev-web --project="$PROJECT" --region="$REGION" --format='value(status.url)')

          curl -fsS "$KERNEL_URL/healthz" | grep -q ok
          curl -fsS "$MERCHANT_URL/healthz" | grep -q ok
          curl -fsS "$YUNO_URL/healthz" | grep -q ok
          curl -fsS "$WEB_URL/healthz" | grep -q ok

      - name: Tick relay + sweeper once (jobs are Scheduler-driven)
        run: |
          gcloud run jobs execute aval-dev-outbox-relay --project="$PROJECT" --region="$REGION" --wait || true
          gcloud run jobs execute aval-dev-sweeper --project="$PROJECT" --region="$REGION" --wait || true
