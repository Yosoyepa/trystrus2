openapi: 3.1.0
info:
  title: Aval Contracts (api + merchant)
  version: 1.0.0
  description: |
    Contrato de APIs para construcción paralela (M0). Dos servicios:
    - `api` (Canal de Confianza): mandates [A], verify/purchases/audit/events [B], escalations/bot [A]
    - `merchant` (VuelaYa): catálogo + checkout + webhooks PayPal [D]
    Reglas: cambios aditivos = v1.x (PR + mock + trustlib en el mismo commit). Cambios rompibles solo antes de M2.
servers:
  - url: https://api.{domain}
    variables:
      domain: { default: localhost, description: dominio propio del demo }
  - url: https://merchant.{domain}
    variables:
      domain: { default: localhost }
tags:
  - { name: mandates, description: "Ciclo de vida del mandato [Dev 3]" }
  - { name: decision, description: "Verificación y decisión de compras [Dev 2]" }
  - { name: escalations, description: "Escalamiento humano (HIL) [Dev 3]" }
  - { name: audit, description: "Trail de auditoría [Dev 2]" }
  - { name: merchant, description: "VuelaYa: catálogo y checkout [Dev 3]" }

paths:
  /.well-known/jwks.json:
    get:
      tags: [mandates]
      summary: JWKS del issuer de mandatos (kid = versión de clave activa)
      responses:
        "200":
          description: JWK Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JWKSet" }

  /mandates:
    post:
      tags: [mandates]
      summary: Crear mandato (inicia ceremonia passkey + enrollment PayPal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MandateCreate" }
      responses:
        "201":
          description: Mandato en draft con desafíos pendientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateDraft" }
    get:
      tags: [mandates]
      summary: Listar mandatos del humano autenticado
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Mandatos (sin SD-JWT crudo)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MandateView" }

  /mandates/{id}:
    get:
      tags: [mandates]
      summary: Estado del mandato
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: Mandato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mandates/{id}/passkey/assert:
    post:
      tags: [mandates]
      summary: Completa la ceremonia passkey (assertion firma el hash del mandato) → active
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAssertion" }
      responses:
        "200":
          description: Mandato activo + SD-JWT emitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateActive" }
        "401": { $ref: "#/components/responses/Rejection" }

  /mandates/{id}/revoke:
    post:
      tags: [mandates]
      summary: Revocar (passkey requerida; dispara DELETE del payment token en el rail)
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAssertion" }
      responses:
        "200":
          description: Revocado (mandate + payment token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateView" }
        "409": { $ref: "#/components/responses/Rejection" }

  /mandates/{id}/verify:
    post:
      tags: [decision]
      summary: |
        Verificación en pay-time (la llama el merchant ANTES de cobrar).
        En UNA transacción: firma SD-JWT + KB del intent + estado + JsonLogic + limits
        + reserva atómica de presupuesto. Idempotente por key.
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Decisión (APPROVED incluye reservation_id con TTL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /purchases:
    post:
      tags: [decision]
      summary: |
        Entrada del agente: intent firmado → saga (gate → checkout merchant → receipt).
        Auth: X-Agent-Id + intent_jwt (la firma ES la autenticación).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseRequest" }
      responses:
        "202":
          description: Compra en curso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }
        "409":
          description: Rejected (ver reason_code) o duplicado (DUPLICATE_JTI devuelve la compra original)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rejection" }

  /purchases/{id}:
    get:
      tags: [decision]
      summary: Estado de la compra (poll del agente/UI)
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: Estado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseStatus" }

  /purchases/{id}/evidence-pack:
    get:
      tags: [audit]
      summary: |
        Bundle de evidencia de disputa (decisión 0022; implementa Dev 3, R-EVIDENCE):
        mandato SD-JWT + ceremonia passkey + intent JWS + decisión del gate + trail +
        receipts + webhooks archivados. Export PDF en UI.
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: Evidence pack verificable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidencePack" }
        "404": { $ref: "#/components/responses/NotFound" }

  /escalations:
    get:
      tags: [escalations]
      summary: Escalamientos (filtro por mandate/estado)
      parameters:
        - { name: mandate_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, resolved, expired] } }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Escalation" }

  /escalations/{id}/resolve:
    post:
      tags: [escalations]
      summary: |
        Resolver escalamiento (bot Telegram o UI). APPROVE con flag sticky=true
        crea mini-mandato derivado firmado. TTL por nivel (decisión 0021):
        L3 120 s · L3+ 300 s con UV (RFC 9470 max_age) → auto-deny fail-closed en ambos.
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
      responses:
        "200":
          description: Resuelto (+ resume de la saga si APPROVE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Escalation" }
        "409": { $ref: "#/components/responses/Rejection" }

  /bot/telegram:
    post:
      tags: [escalations]
      summary: Webhook del bot (valida con token secreto del bot)
      responses:
        "200": { description: OK (Telegram espera siempre 200) }

  /events/stream:
    get:
      tags: [audit]
      summary: SSE de eventos (relé del outbox). Eventos con formato EventEnvelope.
      responses:
        "200":
          description: text/event-stream

  /audit/events:
    get:
      tags: [audit]
      summary: Trail (filtro por mandate, paginado por seq)
      parameters:
        - { name: mandate_id, in: query, schema: { type: string } }
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Eventos auditados (hash chain incluida)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/verify:
    get:
      tags: [audit]
      summary: Re-verifica la hash chain completa + último root firmado (KMS)
      responses:
        "200":
          description: Resultado de verificación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }

  /catalog/offers:
    get:
      tags: [merchant]
      summary: Ofertas de VuelaYa (lo consume el watcher/agente; precios mutan para el demo)
      parameters:
        - { name: origin, in: query, schema: { type: string, example: BOG } }
        - { name: destination, in: query, schema: { type: string, example: COR } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Ofertas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Offer" }

  /checkout/charge:
    post:
      tags: [merchant]
      summary: |
        Cobrar una compra verificada. El merchant: (1) verifica SD-JWT contra JWKS,
        (2) llama /mandates/{id}/verify, (3) SOLO si APPROVED cobra con vault_id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeRequest" }
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "402":
          description: Verify rechazó — no se cobra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rejection" }

  /webhooks/paypal:
    post:
      tags: [merchant]
      summary: Webhooks PayPal (PAYMENT.CAPTURE.COMPLETED, CUSTOMER.DISPUTE.*) — firma verificada
      responses:
        "200": { description: OK }

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Rejection" }
    Rejection:
      description: Rechazo con reason_code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Rejection" }

  schemas:
    ReasonCode:
      type: string
      enum:
        - AMOUNT_EXCEEDS_PER_TXN
        - BUDGET_EXCEEDED
        - LIMIT_EXHAUSTED
        - CATEGORY_FORBIDDEN
        - MERCHANT_NOT_ALLOWED
        - MANDATE_EXPIRED
        - MANDATE_NOT_YET_VALID
        - MANDATE_REVOKED
        - MANDATE_SUSPENDED
        - MANDATE_EXHAUSTED
        - CONDITION_FAILED
        - INVALID_SIGNATURE
        - INVALID_PROOF_OF_POSSESSION
        - DUPLICATE_JTI
        - NONCE_REUSED
        - ESCALATION_TIMEOUT_DENIED
        - RAIL_ERROR
        - RAIL_TOKEN_DELETED

    Decision:
      type: string
      enum: [APPROVED, REJECTED, ESCALATED]

    MandateCreate:
      type: object
      required: [user_id, agent_id, currency, scope, limits, validity]
      properties:
        user_id: { type: string, example: usr_marta }
        agent_id: { type: string, example: agt_flights }
        currency: { type: string, example: USD }
        conditions:
          type: object
          description: JsonLogic sobre el offer (ej. {"<":[{"var":"offer.price"},150]})
          additionalProperties: true
        limits: { $ref: "#/components/schemas/MandateLimits" }
        scope:
          type: object
          properties:
            categories: { type: array, items: { type: string } }
            merchants: { type: array, items: { type: string } }
        validity:
          type: object
          properties:
            not_before: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }

    MandateLimits:
      type: object
      properties:
        max_per_txn: { type: number }
        total_budget: { type: number }
        max_txn:
          type: object
          properties:
            count: { type: integer }
            period: { type: string, enum: [day, week, month] }

    MandateDraft:
      type: object
      properties:
        mandate_id: { type: string }
        status: { type: string, enum: [draft] }
        passkey_challenge: { type: object, description: opciones WebAuthn create() }
        payment_enroll:
          type: object
          properties:
            approve_url: { type: string, description: link de aprobación PayPal (setup token) }

    MandateActive:
      type: object
      properties:
        mandate_id: { type: string }
        status: { type: string, enum: [active] }
        sd_jwt: { type: string, description: SD-JWT completo (issuer-signed + KB esperable) }
        jti: { type: string }

    MandateView:
      type: object
      properties:
        mandate_id: { type: string }
        status: { type: string, enum: [draft, active, suspended, revoked, expired, exhausted] }
        limits: { $ref: "#/components/schemas/MandateLimits" }
        spent: { type: number }
        reserved: { type: number }
        txn_count_period: { type: integer }
        payment_method_ref: { type: string }
        created_at: { type: string, format: date-time }

    PasskeyAssertion:
      type: object
      description: AuthenticationResponse de WebAuthn (verifica UV=true + challenge = hash del mandato)
      additionalProperties: true

    VerifyRequest:
      type: object
      required: [intent_jwt, idempotency_key]
      properties:
        intent_jwt: { type: string, description: JWS detached EdDSA del intent canónico }
        idempotency_key: { type: string }
        agent_id: { type: string }

    VerifyResponse:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        reason_code: { $ref: "#/components/schemas/ReasonCode" }
        reservation_id: { type: string, description: presente si APPROVED; TTL 120 s }
        expires_in: { type: integer, description: segundos de validez de la reserva }
        diff:
          type: object
          description: para ESCALATED — qué límite se excede y por cuánto (payload del mensaje Telegram)

    PurchaseRequest:
      type: object
      required: [intent_jwt]
      properties:
        intent_jwt: { type: string }

    PurchaseStatus:
      type: object
      properties:
        purchase_id: { type: string }
        status: { type: string, enum: [pending_verification, awaiting_escalation, charging, captured, rejected, compensated] }
        reason_code: { $ref: "#/components/schemas/ReasonCode" }
        receipt: { $ref: "#/components/schemas/Receipt" }
        escalation_id: { type: string }

    EvidencePack:
      type: object
      description: bundle criptográfico para respond_dispute / provide-evidence (R-EVIDENCE, decisión 0022)
      properties:
        purchase_id: { type: string }
        mandate_sd_jwt: { type: string }
        ceremony_log: { type: object, description: verificación passkey de la creación del mandato }
        intent_jwt: { type: string }
        gate_decision: { type: object, description: decisión + reason codes + features }
        trail: { type: array, items: { type: object } }
        receipts: { type: array, items: { type: object } }
        webhooks: { type: array, items: { type: object }, description: webhooks archivados (headers + verificación) }
        generated_at: { type: string, format: date-time }

    Escalation:
      type: object
      properties:
        escalation_id: { type: string }
        mandate_id: { type: string }
        purchase_id: { type: string }
        status: { type: string, enum: [pending, resolved, expired] }
        level: { type: string, enum: [L3, L3+], description: "L3=120 s · L3+=300 s con passkey UV (decisión 0021)" }
        diff: { type: object }
        timeout_at: { type: string, format: date-time }
        resolution:
          type: object
          properties:
            decision: { type: string, enum: [APPROVE, REJECT] }
            approver: { type: string }
            channel: { type: string, enum: [telegram, web] }
            resolved_at: { type: string, format: date-time }
            receipt_sig: { type: string, description: approval receipt firmado (evidence bundle) }

    ResolveRequest:
      type: object
      required: [decision, approver, channel]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        approver: { type: string }
        channel: { type: string, enum: [telegram, web] }
        sticky:
          type: object
          description: si viene, crea mini-mandato derivado
          properties:
            max_per_txn: { type: number }
            count: { type: integer }
            period: { type: string }

    AuditEvent:
      type: object
      properties:
        seq: { type: integer }
        mandate_id: { type: string }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        prev_hash: { type: string }
        hash: { type: string }
        root_sig: { type: string, description: JWS KMS del root al cierre de compra (último evento del lote) }
        created_at: { type: string, format: date-time }

    AuditVerifyResult:
      type: object
      properties:
        valid: { type: boolean }
        events_checked: { type: integer }
        last_root: { type: string }
        last_root_verified: { type: boolean }
        error: { type: string }

    Offer:
      type: object
      properties:
        offer_id: { type: string }
        merchant_id: { type: string, example: vuelaya }
        category: { type: string, example: flights }
        title: { type: string, example: BOG→COR morning flight }
        amount: { type: string, example: "130.00" }
        currency: { type: string, example: USD }
        description: { type: string, description: puede contener inyecciones para el demo adversarial }

    ChargeRequest:
      type: object
      required: [purchase_id, mandate_sd_jwt, intent_jwt, payment_method_ref, amount, currency]
      properties:
        purchase_id: { type: string }
        mandate_sd_jwt: { type: string }
        intent_jwt: { type: string }
        payment_method_ref: { type: string, description: payment_token_id (vault) }
        amount: { type: string, example: "130.00" }
        currency: { type: string, example: USD }
        idempotency_key: { type: string }

    Receipt:
      type: object
      properties:
        purchase_id: { type: string }
        paypal_capture_id: { type: string }
        amount: { type: string }
        currency: { type: string }
        captured_at: { type: string, format: date-time }
        mandate_jti: { type: string }

    Rejection:
      type: object
      required: [reason_code]
      properties:
        reason_code: { $ref: "#/components/schemas/ReasonCode" }
        message: { type: string }
        purchase_id: { type: string }

    JWKSet:
      type: object
      additionalProperties: true

    EventEnvelope:
      type: object
      description: formato único del outbox/SSE (catálogo completo en schemas.md)
      properties:
        event_id: { type: string }
        type: { type: string }
        aggregate_id: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
