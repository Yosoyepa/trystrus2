# Alembic — the migration tool the Dockerfile already copies in.
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally empty: env.py reads DATABASE_URL so dev,
# CI and Cloud Run all use the same file with different environments.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
